     홈 01 · 히어로
     아임웹: 메인 페이지 맨 위 섹션을 「코드」 위젯 1개로 교체 → 아래 전체 붙여넣기

<section class="eg eg-hero" id="eg-hero">
<style>
  .eg-hero { padding: clamp(96px, 14vw, 180px) 0 clamp(72px, 9vw, 120px); overflow: hidden; }
  .eg-hero .eg-wrap { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 56px; align-items: end; }
  .eg-hero__eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: var(--eg-sub, #697180); margin-bottom: 28px; }
  .eg-hero__eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: var(--eg-main, #50c8fa); box-shadow: 0 0 0 4px rgba(80,200,250,.22); }
  .eg-hero__title { font-size: clamp(40px, 5.6vw, 68px); font-weight: 800; letter-spacing: -0.04em; line-height: 1.04; }
  .eg-hero__title em { font-style: normal; color: var(--eg-main-deep, #0f9bd6); }
  .eg-hero__lead { margin-top: 28px; max-width: 540px; font-size: clamp(16px, 1.6vw, 19px); line-height: 1.75; color: var(--eg-sub, #697180); }
  .eg-hero__actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 40px; }
  .eg-hero__meta { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--eg-line, #e6e8eb); font-size: 14px; color: var(--eg-sub, #697180); }
  .eg-hero__meta b { color: var(--eg-ink, #111417); font-weight: 700; margin-right: 6px; }
  /* 우측 비주얼: 영상 또는 이미지 */
  .eg-hero__visual { position: relative; aspect-ratio: 4 / 5; border-radius: 24px; overflow: hidden; background: linear-gradient(160deg, #e9f7fe 0%, #50c8fa 100%); }
  .eg-hero__visual video, .eg-hero__visual img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .eg-hero__badge { position: absolute; left: 20px; bottom: 20px; display: inline-flex; flex-direction: column; gap: 2px; padding: 14px 18px; border-radius: 14px; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); color: var(--eg-ink, #111417); }
  .eg-hero__badge strong { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .eg-hero__badge span { font-size: 12.5px; color: var(--eg-sub, #697180); }
  @media (max-width: 960px) {
    .eg-hero .eg-wrap { grid-template-columns: 1fr; gap: 40px; }
    .eg-hero__visual { aspect-ratio: 16 / 10; }
  }
</style>
  <div class="eg-wrap">
    <div class="eg-reveal">

      <p class="eg-hero__lead">마케팅과 디자인이 한 팀으로 움직입니다. 네이버 검색과 지도에서 먼저 보이게 하고, 매달 리포트의 숫자마다 이유와 다음 달 계획을 함께 드립니다.</p>
      <div class="eg-hero__actions">
        <a class="eg-btn eg-btn--primary" href="/CONTACT">상담 문의하기
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
        <a class="eg-btn eg-btn--ghost" href="#eg-cases">성과 사례 보기</a>
      </div>
      <ul class="eg-hero__meta" style="list-style:none;padding-left:0;">
        <li><b>2022</b>부터 병원과 함께</li>
        <li><b>28+</b>협업 병의원</li>
        <li><b>1</b>팀 · 마케팅과 디자인을 같은 팀이</li>
      </ul>

    <div class="eg-hero__visual eg-reveal">

      <video autoplay muted loop playsinline poster="[포스터 이미지 URL]">

      <div class="eg-hero__badge">
        <strong>매달 1회</strong>
        <span>숫자에 설명이 붙는 성과 리포트</span>
      </div>
    </div>
  </div>
</section>
