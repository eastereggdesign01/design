<!-- ============================================================
     홈 09 · 상담 CTA (모든 페이지 하단 공통으로 써도 됩니다)
     교체할 것: 카카오톡 채널 링크가 있으면 두 번째 버튼 href 교체, 없으면 버튼 삭제
     ============================================================ -->
<section class="eg eg-cta" id="eg-cta">
<style>
  .eg-cta { padding: 0 0 var(--eg-section-y, 120px); }
  .eg-cta__box { position: relative; overflow: hidden; border-radius: 28px; background: var(--eg-dark, #0e1216); color: #fff; padding: clamp(48px, 7vw, 96px) clamp(28px, 6vw, 80px); display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 40px; align-items: center; }
  .eg-cta__box::before { content: ''; position: absolute; right: -120px; top: -120px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(closest-side, rgba(80,200,250,.55), rgba(80,200,250,0)); pointer-events: none; }
  .eg-cta__title { font-size: clamp(28px, 4.2vw, 48px); font-weight: 800; letter-spacing: -0.035em; line-height: 1.12; }
  .eg-cta__title em { font-style: normal; color: var(--eg-main, #50c8fa); }
  .eg-cta__desc { margin-top: 18px; font-size: 16px; line-height: 1.7; color: rgba(255,255,255,.66); max-width: 520px; }
  .eg-cta__actions { display: flex; flex-direction: column; gap: 12px; align-items: stretch; position: relative; }
  .eg-cta__actions .eg-btn { height: 60px; font-size: 17px; }
  .eg-cta__box .eg-btn--ghost { color: #fff; border-color: rgba(255,255,255,.28); }
  .eg-cta__box .eg-btn--ghost:hover { border-color: #fff; }
  .eg-cta__tel { text-align: center; font-size: 14px; color: rgba(255,255,255,.6); margin-top: 6px; }
  .eg-cta__tel a { color: #fff; font-weight: 700; text-decoration: none; }
  @media (max-width: 900px) { .eg-cta__box { grid-template-columns: 1fr; } }
</style>
  <div class="eg-wrap">
    <div class="eg-cta__box eg-reveal">
      <div>
        <h2 class="eg-cta__title">우리 병원에 맞는 방법이 궁금하다면,<br><em>30분 진단 미팅</em>부터 시작하세요.</h2>
        <p class="eg-cta__desc">현재 네이버 노출 상태와 유입 경로를 보고, 지금 바꾸면 효과가 큰 것 세 가지를 먼저 알려드립니다. 부담 없이 문의 주세요.</p>
      </div>
      <div class="eg-cta__actions">
        <a class="eg-btn eg-btn--brand" href="/CONTACT">상담 문의 남기기</a>
        <a class="eg-btn eg-btn--ghost" href="[카카오톡 채널 URL]" target="_blank" rel="noopener">카카오톡으로 문의</a>
        <p class="eg-cta__tel">평일 10:00–18:00 · <a href="tel:032-710-2258">032-710-2258</a></p>
      </div>
    </div>
  </div>
</section>
