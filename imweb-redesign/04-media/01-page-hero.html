<!-- ============================================================
     MEDIA 01 · 페이지 히어로 (풀폭 영상 배경)
     교체할 것: 쇼릴 영상 mp4 URL + 포스터 이미지. 모바일은 세로 영상이 있으면 <source media> 로 분기.
     ============================================================ -->
<section class="eg eg-mhero" id="eg-mhero">
<style>
  .eg-mhero { padding: 0; min-height: min(86vh, 820px); display: flex; align-items: flex-end; color: #fff; background: #0e1216; overflow: hidden; }
  .eg-mhero__bg { position: absolute; inset: 0; }
  .eg-mhero__bg video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .eg-mhero__bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(14,18,22,.92) 0%, rgba(14,18,22,.35) 50%, rgba(14,18,22,.2) 100%); }
  .eg-mhero .eg-wrap { position: relative; padding-top: 160px; padding-bottom: 72px; }
  .eg-mhero__crumb { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.6); margin-bottom: 20px; }
  .eg-mhero__crumb a { color: inherit; text-decoration: none; }
  .eg-mhero__title { font-size: clamp(36px, 5.8vw, 72px); font-weight: 800; letter-spacing: -0.04em; line-height: 1.06; }
  .eg-mhero__title small { display: block; font-size: clamp(14px, 1.4vw, 18px); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--eg-main, #50c8fa); margin-bottom: 14px; }
  .eg-mhero__row { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; margin-top: 28px; }
  .eg-mhero__lead { max-width: 520px; font-size: clamp(16px, 1.6vw, 19px); line-height: 1.7; color: rgba(255,255,255,.72); }
  .eg-mhero__actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .eg-mhero .eg-btn--ghost { color: #fff; border-color: rgba(255,255,255,.32); }
  .eg-mhero .eg-btn--ghost:hover { border-color: #fff; }
  @media (max-width: 800px) { .eg-mhero { min-height: min(72vh, 640px); } .eg-mhero .eg-wrap { padding-top: 120px; padding-bottom: 48px; } .eg-mhero__row { flex-direction: column; align-items: flex-start; } }
</style>
  <div class="eg-mhero__bg">
    <video autoplay muted loop playsinline poster="[포스터 이미지 URL]">
      <source src="[모바일 세로 쇼릴 mp4 URL]" type="video/mp4" media="(max-width: 768px)">
      <source src="[PC 가로 쇼릴 mp4 URL]" type="video/mp4">

      <div class="eg-mhero__actions">

        <a class="eg-btn eg-btn--ghost" href="#eg-reel">작업 영상 보기</a>

</section>
