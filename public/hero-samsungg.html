<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼성G정형외과 — 메인 히어로</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     삼성G정형외과 메인 히어로 — 8컷 크로스페이드 + 카피 오버레이
     · 클립 교체: 아래 JS의 CUTS 배열에서 src만 바꾸면 됩니다
     · 카피 수정: CUTS 배열의 copy / sub 텍스트만 바꾸면 됩니다
     · 영상 호스팅: Cloudinary (업로드 불필요, 링크 영구 유지)
       q_auto,f_auto = 브라우저별 최적 코덱/화질 자동 변환
     · 재생 순서: cut4(원장 상담, 오프닝) → cut1 리셉션 → cut2 대기공간
       → cut3 C-arm실 → cut5 회복실 → cut6 진찰 → cut7 원장→로고 엔딩
     · 파일명은 그대로 두고 배열 순서만 바꾼 것이므로 업로드는 동일
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .sg-hero {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 0; /* iframe 삽입용 — 프레임 높이에 맞춤 */
    overflow: hidden;
    background: #0e0e0e;
  }

  .sg-hero video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 1.1s ease-in-out; /* 디졸브 길이 */
  }
  .sg-hero video.is-active { opacity: 1; }

  /* 가독성용 은은한 딤 (레퍼런스 톤에 맞춰 매우 약하게) */
  .sg-hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.12) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,.22) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* ---------- 카피 ---------- */
  .sg-copy {
    position: absolute;
    left: 8vw;
    bottom: 18vh;
    z-index: 3;
    color: #fff;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity .9s ease, transform .9s ease;
    text-shadow: 0 1px 14px rgba(0,0,0,.35);
    pointer-events: none;
  }
  .sg-copy.is-visible { opacity: 1; transform: translateY(0); }

  .sg-copy .hanja {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(13px, 1.1vw, 17px);
    letter-spacing: .45em;
    opacity: .82;
    margin-bottom: 14px;
  }
  .sg-copy .main {
    font-family: 'Noto Serif KR', serif;
    font-weight: 600;
    font-size: clamp(24px, 3.1vw, 46px);
    line-height: 1.4;
    letter-spacing: -0.01em;
  }
  .sg-copy .sub {
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 300;
    font-size: clamp(13px, 1.15vw, 18px);
    margin-top: 16px;
    opacity: .92;
    letter-spacing: .02em;
  }

  /* 진행 인디케이터 (선택 — 필요 없으면 .sg-dots 삭제) */
  .sg-dots {
    position: absolute;
    left: 8vw;
    bottom: 9vh;
    z-index: 3;
    display: flex;
    gap: 10px;
  }
  .sg-dots span {
    width: 22px; height: 2px;
    background: rgba(255,255,255,.35);
    transition: background .4s;
  }
  .sg-dots span.on { background: rgba(255,255,255,.95); }

  @media (max-width: 768px) {
    .sg-copy { left: 6vw; right: 6vw; bottom: 16vh; }
  }
</style>
</head>
<body>

<section class="sg-hero" id="sgHero">
  <video id="sgVideoA" muted playsinline preload="auto"></video>
  <video id="sgVideoB" muted playsinline preload="auto"></video>

  <div class="sg-copy" id="sgCopy">
    <div class="hanja" id="sgHanja"></div>
    <div class="main" id="sgMain"></div>
    <div class="sub" id="sgSub"></div>
  </div>

  <div class="sg-dots" id="sgDots"></div>
</section>

<script>
(function () {
  /* ── 컷 정의: 순서·클립·카피를 여기서만 관리 ─────────────── */
  var CUTS = [
    { src: "https://res.cloudinary.com/dm7nivu1d/video/upload/c_crop,w_1600,h_900,x_160,y_90/c_scale,w_1920,h_1080/q_auto,f_auto/samsung-g/hero/cut1.mp4",
      copy: "일상을 멈춰 세운 통증 앞에서,<br>치료는 삶을 다시 편안하게 하는 일입니다", sub: "", hanja: "" },
    { src: "https://res.cloudinary.com/dm7nivu1d/video/upload/c_crop,w_1600,h_900,x_160,y_40/c_scale,w_1920,h_1080/q_auto,f_auto/samsung-g/hero/cut4.mp4",
      copy: "힘든 삶의 자리,<br>그 옆에 서는 진료", sub: "", hanja: "" },
    { src: "https://res.cloudinary.com/dm7nivu1d/video/upload/q_auto,f_auto/samsung-g/hero-v2/cut4.mp4",
      copy: "연구하고, 함께 뛰고,<br>나누는 의원", sub: "의학박사 · 스포츠의학 인증 전문의 · 의료봉사 20년", hanja: "" },
    { src: "https://res.cloudinary.com/dm7nivu1d/video/upload/q_auto,f_auto/samsung-g/hero-v2/cut7.mp4",
      copy: "검사부터 처치까지,<br>진료실 안에서 한 번에", sub: "", hanja: "" },
    { src: "https://res.cloudinary.com/dm7nivu1d/video/upload/q_auto,f_auto/samsung-g/hero/cut5.mp4",
      copy: "시술 후 당일 퇴원,<br>낮병동 시스템", sub: "", hanja: "" },
    { src: "https://res.cloudinary.com/dm7nivu1d/video/upload/q_auto,f_auto/samsung-g/hero-v2/cut9.mp4",
      copy: "무릎 · 어깨 · 허리<br>자신 있게 치료합니다", sub: "", hanja: "" },
    { src: "https://res.cloudinary.com/dm7nivu1d/video/upload/c_crop,w_1600,h_900,x_160,y_30/c_scale,w_1920,h_1080/q_auto,f_auto/samsung-g/hero/cut7.mp4",
      copy: "받들고 섬기는 병원", sub: "군포 삼성G정형외과", hanja: "奉 仕" }
  ];

  var CUT_SEC = 4.6;      // 컷당 노출 시간(초) — 클립 5초, 끝나기 전에 전환
  var COPY_IN = 500;      // 컷 시작 후 카피 등장까지(ms)
  var COPY_OUT = 3700;    // 컷 시작 후 카피 퇴장까지(ms)

  var vids = [document.getElementById('sgVideoA'), document.getElementById('sgVideoB')];
  var copyBox = document.getElementById('sgCopy');
  var elHanja = document.getElementById('sgHanja');
  var elMain  = document.getElementById('sgMain');
  var elSub   = document.getElementById('sgSub');
  var dotsBox = document.getElementById('sgDots');

  CUTS.forEach(function () {
    var s = document.createElement('span');
    dotsBox.appendChild(s);
  });
  var dots = dotsBox.children;

  var idx = 0, front = 0, timers = [];

  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

  function showCut(i) {
    clearTimers();
    var cur = vids[front];
    var nxt = vids[1 - front];

    nxt.src = CUTS[i].src;
    nxt.currentTime = 0;
    var playP = nxt.play();
    if (playP && playP.catch) playP.catch(function(){});

    nxt.classList.add('is-active');
    cur.classList.remove('is-active');
    front = 1 - front;

    for (var d = 0; d < dots.length; d++) dots[d].classList.toggle('on', d === i);

    copyBox.classList.remove('is-visible');
    timers.push(setTimeout(function () {
      elHanja.innerHTML = CUTS[i].hanja || '';
      elHanja.style.display = CUTS[i].hanja ? 'block' : 'none';
      elMain.innerHTML = CUTS[i].copy;
      elSub.innerHTML = CUTS[i].sub || '';
      elSub.style.display = CUTS[i].sub ? 'block' : 'none';
      copyBox.classList.add('is-visible');
    }, COPY_IN));
    timers.push(setTimeout(function () {
      copyBox.classList.remove('is-visible');
    }, COPY_OUT));

    // 다음 컷 미리 로드
    var pre = new Image ? document.createElement('video') : null;
    if (pre) { pre.src = CUTS[(i + 1) % CUTS.length].src; pre.preload = 'auto'; }

    timers.push(setTimeout(function () {
      idx = (i + 1) % CUTS.length;
      showCut(idx);
    }, CUT_SEC * 1000));
  }

  // 첫 컷 시작
  vids[0].src = CUTS[0].src;
  showCut(0);

  // 탭 비활성화 후 복귀 시 재동기화
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) showCut(idx);
  });
})();
</script>

</body>
</html>
